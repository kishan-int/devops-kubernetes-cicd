name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: |
          pip install -r requirements.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-demo-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/devops-demo-app:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/devops-demo-deployment \
            devops-demo=ghcr.io/${{ github.repository_owner }}/devops-demo-app:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/devops-demo-deployment --timeout=120s
      - name: Verify deployment
        run: |
          kubectl get pods -l app=devops-demo

      - name: Port forward application
        run: |
          kubectl port-forward service/devops-demo-service 8081:80 > /tmp/port-forward.log 2>&1 &
          sleep 5

      - name: Health check
        run: |
          curl --fail http://localhost:8081/health